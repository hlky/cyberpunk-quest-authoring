<rect class="bg" width="1500" height="720"/>
<text class="title" x="40" y="48">cqa004 terminating-child handoff contract</text>
<text class="subtitle" x="40" y="77">Exact socket names at the external phase boundary</text>
<rect class="panel-blue" x="60" y="145" width="390" height="260" rx="12"/>
<text class="panel-title" x="78" y="176">Parent graph • phase node ID 13</text>
<text class="detail" x="78" y="206">input socket: In1</text>
<text class="detail" x="78" y="228">output socket: Out1</text>
<text class="detail" x="78" y="250">socket: CutDestination</text>
<text class="detail" x="78" y="272">phaseGraph: null</text>
<text class="detail" x="78" y="294">phaseResource: cqa004_boundary.questphase</text>
<rect class="panel-amber" x="550" y="145" width="390" height="260" rx="12"/>
