<text class="edge-label" x="745" y="523">CutDestination • present on nodes • deliberately unwired</text>
<text class="label" x="60" y="590">Structural contract: exact sockets and terminating output.</text>
<text class="warn" x="60" y="618">Runtime interpretation of CutDestination: Experimental; this lab creates no cut edge.</text>
<text class="note" x="1430" y="665" text-anchor="end">Experimental — parent/child runtime acceptance pending</text>
