<text class="detail" x="568" y="206">questInput socketName: In1</text>
<text class="detail" x="568" y="228">child work executes</text>
<text class="detail" x="568" y="250">questOutput socketName: Out1</text>
<text class="detail" x="568" y="272">questOutput type: Terminating</text>
<text class="detail" x="568" y="294">phasePrefabs: []</text>
<rect class="panel-blue" x="1040" y="145" width="390" height="260" rx="12"/>
