<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">cqa004 terminating-child handoff contract</title>
<desc id="svg-desc">Parent execution enters the phase node at In1, the child input is also named In1, the terminating child output Out1 returns through the parent phase node Out1, and CutDestination remains deliberately unwired.</desc>
<metadata>{&quot;diagram&quot;:&quot;conceptual-handoff-contract&quot;,&quot;evidence_class&quot;:&quot;Experimental&quot;}</metadata>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9d1dc"/></marker>
<style>
