<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: CC-BY-4.0 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three separate Cyberpunk 2077 localization lookup paths</title>
  <desc id="desc">Three dotted lookup chains compare journal and UI text, spoken scene dialogue, and scene choice labels. Each chain begins with a different identifier and ends in a different text or audio owner.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d8dee9"/>
    </marker>
    <style>
      .bg { fill: #10151d; }
      .lane { fill: #181f2a; stroke: #465266; stroke-width: 1.5; }
      .journal { fill: #174f3d; stroke: #55d69b; stroke-width: 2; }
      .scene { fill: #5a2945; stroke: #f38abb; stroke-width: 2; }
      .lookup { fill: #293a63; stroke: #84a9ff; stroke-width: 2; }
      .payload { fill: #49366b; stroke: #bc9cff; stroke-width: 2; }
      .edge { fill: none; stroke: #d8dee9; stroke-width: 2.2; stroke-dasharray: 3 8; stroke-linecap: round; marker-end: url(#arrow); }
      .title { fill: #f7f9fc; font: 700 28px system-ui, sans-serif; }
      .subtitle { fill: #aeb8c8; font: 15px system-ui, sans-serif; }
      .lane-title { fill: #f7f9fc; font: 700 18px system-ui, sans-serif; }
      .box-title { fill: #ffffff; font: 700 15px system-ui, sans-serif; text-anchor: middle; }
      .box-detail { fill: #e2e7ef; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; text-anchor: middle; }
      .note { fill: #bac4d3; font: 13px system-ui, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720" rx="18"/>
  <text class="title" x="54" y="52">Three text systems, three lookup contracts</text>
  <text class="subtitle" x="54" y="80">Dotted arrows are resource or identifier lookups—not quest execution edges.</text>

  <rect class="lane" x="40" y="108" width="1120" height="168" rx="14"/>
  <text class="lane-title" x="64" y="139">Journal and UI text</text>
  <rect class="journal" x="66" y="161" width="190" height="78" rx="8"/>
  <text class="box-title" x="161" y="190">Journal field</text>
  <text class="box-detail" x="161" y="214">LocalizationString.value</text>
  <path class="edge" d="M256 200 H302"/>
  <rect class="lookup" x="304" y="161" width="190" height="78" rx="8"/>
  <text class="box-title" x="399" y="190">Text key</text>
  <text class="box-detail" x="399" y="214">secondaryKey</text>
  <path class="edge" d="M494 200 H540"/>
  <rect class="payload" x="542" y="161" width="245" height="78" rx="8"/>
  <text class="box-title" x="664" y="190">Onscreen localization entry</text>
  <text class="box-detail" x="664" y="214">femaleVariant / maleVariant</text>
  <path class="edge" d="M787 200 H833"/>
  <rect class="journal" x="835" y="161" width="260" height="78" rx="8"/>
  <text class="box-title" x="965" y="190">Journal, tracker, phone UI</text>
  <text class="box-detail" x="965" y="214">ArchiveXL: onscreens</text>

  <rect class="lane" x="40" y="294" width="1120" height="168" rx="14"/>
  <text class="lane-title" x="64" y="325">Spoken scene dialogue</text>
  <rect class="scene" x="66" y="350" width="190" height="88" rx="8"/>
  <text class="box-title" x="161" y="383">Screenplay line</text>
  <text class="box-detail" x="161" y="407">locstringId.ruid</text>
  <path class="edge" d="M256 394 H320 V363 H358"/>
  <path class="edge" d="M320 394 V421 H358"/>
  <rect class="lookup" x="360" y="338" width="250" height="50" rx="8"/>
  <text class="box-title" x="485" y="358">Subtitle map + entry</text>
  <text class="box-detail" x="485" y="378">same numeric stringId</text>
  <path class="edge" d="M610 363 H788"/>
  <rect class="payload" x="790" y="338" width="305" height="50" rx="8"/>
  <text class="box-title" x="942" y="358">Subtitle text</text>
  <text class="box-detail" x="942" y="378">ArchiveXL: subtitles</text>
  <rect class="lookup" x="360" y="396" width="250" height="50" rx="8"/>
  <text class="box-title" x="485" y="416">Voiceover map entry</text>
  <text class="box-detail" x="485" y="436">same numeric stringId</text>
  <path class="edge" d="M610 421 H788"/>
  <rect class="payload" x="790" y="396" width="305" height="50" rx="8"/>
  <text class="box-title" x="942" y="416">WEM audio resource</text>
  <text class="box-detail" x="942" y="436">ArchiveXL: vomaps</text>

  <rect class="lane" x="40" y="480" width="1120" height="168" rx="14"/>
  <text class="lane-title" x="64" y="511">Scene choice labels</text>
  <rect class="scene" x="66" y="533" width="190" height="78" rx="8"/>
  <text class="box-title" x="161" y="562">Choice node option</text>
  <text class="box-detail" x="161" y="586">screenplayOptionId.id</text>
  <path class="edge" d="M256 572 H302"/>
  <rect class="scene" x="304" y="533" width="230" height="78" rx="8"/>
  <text class="box-title" x="419" y="562">Screenplay option</text>
  <text class="box-detail" x="419" y="586">itemId → locstringId.ruid</text>
  <path class="edge" d="M534 572 H580"/>
  <rect class="lookup" x="582" y="533" width="230" height="78" rx="8"/>
  <text class="box-title" x="697" y="562">Embedded locStore</text>
  <text class="box-detail" x="697" y="586">vdEntries → vpeIndex</text>
  <path class="edge" d="M812 572 H858"/>
  <rect class="payload" x="860" y="533" width="235" height="78" rx="8"/>
  <text class="box-title" x="977" y="562">Choice payload text</text>
  <text class="box-detail" x="977" y="586">vpEntries[vpeIndex].content</text>

  <text class="note" x="54" y="686">A correct caption cannot repair a broken locStore; an onscreen key cannot replace a scene locstring ID.</text>
</svg>
