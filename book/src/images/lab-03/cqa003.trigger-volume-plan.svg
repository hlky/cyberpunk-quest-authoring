<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">cqa003 polygonal trigger-volume plan — Experimental</title>
<desc id="svg-desc">Top-down and orthographic elevation views of the cqa003 concentric polygonal trigger prisms centered at x minus 1000.02 and y 1497.2208. The reach trigger is a 16-gon with circumradius 25 metres, base z 2.3, and height 12 metres; the leave trigger is a 20-gon with circumradius 110 metres, base z 0.3, and height 16 metres. Both volume centers are at z 8.3. A marker sits at the common x and y center and a player path enters the reach volume before leaving the larger volume. Diagram evidence state: pending; runtime test date: Not yet recorded.</desc>
<metadata>{&quot;center&quot;:{&quot;x&quot;:-1000.02,&quot;y&quot;:1497.2208},&quot;evidence&quot;:{&quot;class&quot;:&quot;experimental&quot;,&quot;date&quot;:null,&quot;status&quot;:&quot;pending&quot;},&quot;leave&quot;:{&quot;base_z&quot;:0.3,&quot;circumradius_m&quot;:110,&quot;height_m&quot;:16,&quot;point_count&quot;:20,&quot;top_z&quot;:16.3},&quot;reach&quot;:{&quot;base_z&quot;:2.3,&quot;circumradius_m&quot;:25,&quot;height_m&quot;:12,&quot;point_count&quot;:16,&quot;top_z&quot;:14.3}}</metadata>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
        markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9d1dc"/>
</marker>
<marker id="dim-arrow" viewBox="0 0 10 10" refX="5" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M 10 0 L 0 5 L 10 10" fill="none" stroke="#d8dee9" stroke-width="1.5"/>
</marker>
<style>
