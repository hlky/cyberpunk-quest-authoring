name: Book

on:
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/pages.yml"
      - "book/**"
      - "assets/diagrams/**"
      - "evidence/**"
      - "examples/**"
      - "scripts/**"
      - "LICENSE.md"
      - "LICENSE-MIT"
      - "README.md"
      - "CONTRIBUTING.md"
      - "STYLE.md"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/pages.yml"
      - "book/**"
      - "assets/diagrams/**"
      - "evidence/**"
      - "examples/**"
      - "scripts/**"
      - "LICENSE.md"
      - "LICENSE-MIT"
      - "README.md"
      - "CONTRIBUTING.md"
      - "STYLE.md"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate documentation sources and examples
        run: python scripts/validate.py

      - name: Install mdBook
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output mdbook.tar.gz
          tar -xzf mdbook.tar.gz
          chmod +x mdbook

      - name: Build book
        run: ./mdbook build book

      - name: Package example checkpoints
        run: python scripts/package_examples.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
